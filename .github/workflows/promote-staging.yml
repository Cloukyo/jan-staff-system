name: Promote Commercial Staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact commercial commit SHA to deploy to staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: commercial-staging
  cancel-in-progress: false

jobs:
  staging:
    name: Build and deploy commercial staging
    if: github.repository == 'Cloukyo/sh-workforce-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: commercial-staging
    steps:
      - name: Check out requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.git_ref }}
          persist-credentials: false
      - name: Verify exact commit
        shell: bash
        run: |
          test "${{ github.repository }}" = "Cloukyo/sh-workforce-platform"
          test "$(git rev-parse HEAD)" = "${{ inputs.git_ref }}"
          test "${{ inputs.git_ref }}" = "$(git rev-parse HEAD)"
          case "$(git remote get-url origin)" in
            https://github.com/Cloukyo/sh-workforce-platform|https://github.com/Cloukyo/sh-workforce-platform.git) ;;
            *) exit 1 ;;
          esac
      - name: Verify staging deployment authority is configured
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.COMMERCIAL_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run release checks
        run: npm test
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.5.1
      - name: Pull commercial staging configuration
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.COMMERCIAL_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_VERCEL_PROJECT_ID }}
      - name: Build once for staging
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.COMMERCIAL_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_VERCEL_PROJECT_ID }}
          DEPLOYMENT_SHA: ${{ inputs.git_ref }}
      - name: Deploy prebuilt staging artifact
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.COMMERCIAL_VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_VERCEL_PROJECT_ID }}
      - name: Record staging deployment
        run: echo "Commercial staging deployment ${{ steps.deploy.outputs.url }} at ${{ inputs.git_ref }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deployed staging SHA
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ inputs.git_ref }}
        run: |
          node -e 'const response=await fetch(process.env.DEPLOYED_URL+"/api/health/ready");if(!response.ok)throw new Error("staging readiness failed");const body=await response.json();if(body.environment!=="staging"||body.deploymentSha!==process.env.EXPECTED_SHA)throw new Error("staging SHA or environment mismatch")'
