name: Deploy Commercial Staging Candidate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA currently at commercial main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: commercial-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify exact staging SHA
    if: github.repository == 'Cloukyo/sh-workforce-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: commercial-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Require the exact commercial main SHA
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:migrations
      - run: npm run verify:browser-bundle
      - run: npm run audit:dependencies
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.5.1
      - name: Pull Commercial Staging configuration
        run: vercel pull --yes --environment=preview --token="${{ secrets.COMMERCIAL_STAGING_VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
      - name: Build exact candidate
        run: vercel build --token="${{ secrets.COMMERCIAL_STAGING_VERCEL_TOKEN }}"
        env:
          DEPLOYMENT_SHA: ${{ inputs.expected_sha }}
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
      - name: Deploy exact candidate
        run: vercel deploy --prebuilt --token="${{ secrets.COMMERCIAL_STAGING_VERCEL_TOKEN }}" > staging-url.txt
        env:
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
      - name: Verify staging identity, liveness, readiness, and SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          staging_url="$(cat staging-url.txt)"
          curl --fail --silent --show-error "$staging_url/api/health/live" > live.json
          curl --fail --silent --show-error "$staging_url/api/health/ready" > ready.json
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['live.json', 'ready.json']) {
            const result = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (result.environment !== 'staging') throw new Error(`${file} is not Commercial Staging`);
            if (result.deploymentSha !== process.env.EXPECTED_SHA) throw new Error(`${file} SHA mismatch`);
            if (result.ok !== true) throw new Error(`${file} is not healthy`);
          }
          NODE
          echo "Commercial Staging verified at $staging_url for $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
