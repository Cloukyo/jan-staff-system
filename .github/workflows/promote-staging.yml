name: Deploy Commercial Staging Candidate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA currently at commercial main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: commercial-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify exact staging SHA
    if: github.repository == 'Cloukyo/sh-workforce-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: commercial-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Require the exact commercial main SHA
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.expected_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:migrations
      - run: npm run verify:browser-bundle
      - run: npm run audit:dependencies
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.5.1
      - name: Deploy exact candidate
        shell: bash
        run: |
          set -o pipefail
          vercel deploy --yes \
            --build-env "DEPLOYMENT_SHA=${{ inputs.expected_sha }}" \
            --env "DEPLOYMENT_SHA=${{ inputs.expected_sha }}" \
            --meta "githubCommitSha=${{ inputs.expected_sha }}" \
            --token="${{ secrets.COMMERCIAL_VERCEL_TOKEN }}" 2>&1 | tee deployment.log
          grep -Eo 'https://[^[:space:]]+\.vercel\.app' deployment.log | tail -1 > staging-url.txt
          test -s staging-url.txt
        env:
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
      - name: Verify staging identity, liveness, readiness, and SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_PROJECT: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
        run: |
          staging_url="$(cat staging-url.txt)"
          vercel inspect "$staging_url" --json --token="${{ secrets.COMMERCIAL_VERCEL_TOKEN }}" > deployment.json
          vercel curl "$staging_url/api/health/live" --silent --token="${{ secrets.COMMERCIAL_VERCEL_TOKEN }}" > live.json
          vercel curl "$staging_url/api/health/ready" --silent --token="${{ secrets.COMMERCIAL_VERCEL_TOKEN }}" > ready.json
          node - <<'NODE'
           const fs = require('fs');
           const deployment = JSON.parse(fs.readFileSync('deployment.json', 'utf8'));
           const outputs = (deployment.builds ?? []).flatMap((build) => build.output ?? []);
           const projectIds = outputs
             .map((output) => typeof output.digest === 'string' ? output.digest.split('/')[0] : null)
             .filter(Boolean);
           const project = deployment.projectId ?? deployment.project?.id;
           if (project !== process.env.EXPECTED_PROJECT && !projectIds.includes(process.env.EXPECTED_PROJECT)) {
             throw new Error('Staging deployment project mismatch');
           }
           const regions = [
             ...(deployment.regions ?? []),
             ...outputs.flatMap((output) => output.lambda?.deployedTo ?? []),
           ];
           if (!regions.includes("lhr1")) {
             throw new Error('Commercial Staging functions are not running in London');
           }
          for (const file of ['live.json', 'ready.json']) {
            const result = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (result.environment !== 'staging') throw new Error(`${file} is not Commercial Staging`);
            if (result.deploymentSha !== process.env.EXPECTED_SHA) throw new Error(`${file} SHA mismatch`);
             if (result.status !== "ok") throw new Error(`${file} is not healthy`);
          }
          NODE
          echo "Commercial Staging verified at $staging_url for $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
