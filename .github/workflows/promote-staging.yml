name: Deploy Commercial Staging Candidate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full SHA currently at commercial main
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}

concurrency:
  group: commercial-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify exact staging SHA
    if: github.repository == 'Cloukyo/sh-workforce-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: commercial-staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Require the exact commercial main SHA
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:migrations
      - run: npm run verify:browser-bundle
      - run: npm run audit:dependencies
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.5.1
      - name: Verify staging target before deployment
        shell: bash
        env:
          EXPECTED_ENVIRONMENT: staging
          EXPECTED_PROJECT: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_ORG_ID }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.COMMERCIAL_VERCEL_TOKEN }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $VERCEL_ACCESS_TOKEN" \
            "https://api.vercel.com/v9/projects/$EXPECTED_PROJECT?teamId=$VERCEL_ORG_ID" > "$RUNNER_TEMP/commercial-project.json"
          node scripts/verify-commercial-deployment.mjs project "$RUNNER_TEMP/commercial-project.json"
      - name: Deploy exact candidate
        shell: bash
        run: |
          set -o pipefail
          vercel deploy --yes --regions lhr1 \
            --build-env "DEPLOYMENT_SHA=$EXPECTED_SHA" \
            --env "DEPLOYMENT_SHA=$EXPECTED_SHA" \
            --meta "githubCommitSha=$EXPECTED_SHA" \
            --token="$VERCEL_ACCESS_TOKEN" 2>&1 | tee deployment.log
          grep -Eo 'https://[^[:space:]]+\.vercel\.app' deployment.log | tail -1 > staging-url.txt
          test -s staging-url.txt
        env:
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.COMMERCIAL_VERCEL_TOKEN }}
      - name: Verify staging identity, liveness, readiness, and SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_ENVIRONMENT: staging
          EXPECTED_PROJECT: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.COMMERCIAL_VERCEL_TOKEN }}
          STAGING_BYPASS_SECRET: ${{ secrets.COMMERCIAL_STAGING_AUTOMATION_BYPASS_SECRET }}
        run: |
          staging_url="$(cat staging-url.txt)"
          staging_host="$(node scripts/verify-commercial-deployment.mjs url "$staging_url")"
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $VERCEL_ACCESS_TOKEN" \
            "https://api.vercel.com/v13/deployments/$staging_host?teamId=$VERCEL_ORG_ID&withGitRepoInfo=true" \
            > deployment.json
          DEPLOYMENT_URL="$staging_url" node scripts/verify-commercial-deployment.mjs deployment deployment.json
          curl --fail --silent --show-error --max-time 30 \
            --header "x-vercel-protection-bypass: $STAGING_BYPASS_SECRET" \
            "$staging_url/api/health/live" > live.json
          curl --fail --silent --show-error --max-time 30 \
            --header "x-vercel-protection-bypass: $STAGING_BYPASS_SECRET" \
            "$staging_url/api/health/ready" > ready.json
          node scripts/verify-commercial-deployment.mjs health live.json ready.json
          echo "Commercial Staging verified at $staging_url for $EXPECTED_SHA" >> "$GITHUB_STEP_SUMMARY"
