name: Release Commercial Production

on:
  workflow_dispatch:
    inputs:
      staging_deployment_url:
        description: Exact Commercial Staging deployment URL already verified
        required: true
        type: string
      expected_sha:
        description: Full release-candidate commit SHA
        required: true
        type: string
      confirmation:
        description: Type RELEASE COMMERCIAL to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: commercial-production-release
  cancel-in-progress: false

jobs:
  verify-candidate:
    name: Verify exact candidate
    if: >-
      github.repository == 'Cloukyo/sh-workforce-platform' &&
      inputs.confirmation == 'RELEASE COMMERCIAL'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Assert exact candidate and commercial main ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "${{ inputs.expected_sha }}" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:migrations
      - run: npm run verify:browser-bundle
      - run: npm run audit:dependencies

  verify-staging-sha:
    name: Verify exact SHA in Commercial Staging
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.5.1
      - name: Inspect staging deployment
        run: vercel inspect "${{ inputs.staging_deployment_url }}" --json --token="${{ secrets.COMMERCIAL_STAGING_VERCEL_TOKEN }}" > deployment.json
        env:
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
      - name: Assert staging project and SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_PROJECT: ${{ secrets.COMMERCIAL_STAGING_VERCEL_PROJECT_ID }}
        run: |
          node - <<'NODE'
          const deployment = require('./deployment.json');
          const sha = deployment.meta?.githubCommitSha ?? deployment.gitSource?.sha ?? deployment.source?.sha;
          const project = deployment.projectId ?? deployment.project?.id;
          if (sha !== process.env.EXPECTED_SHA) throw new Error('Staging deployment SHA mismatch');
          if (project !== process.env.EXPECTED_PROJECT) throw new Error('Staging deployment project mismatch');
          NODE
      - name: Verify staging liveness and readiness for the same SHA
        shell: bash
        env:
          STAGING_URL: ${{ inputs.staging_deployment_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          vercel curl "$STAGING_URL/api/health/live" --silent --token="${{ secrets.COMMERCIAL_STAGING_VERCEL_TOKEN }}" > live.json
          vercel curl "$STAGING_URL/api/health/ready" --silent --token="${{ secrets.COMMERCIAL_STAGING_VERCEL_TOKEN }}" > ready.json
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['live.json', 'ready.json']) {
            const result = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (result.environment !== 'staging') throw new Error(`${file} is not Commercial Staging`);
            if (result.deploymentSha !== process.env.EXPECTED_SHA) throw new Error(`${file} SHA mismatch`);
            if (result.ok !== true) throw new Error(`${file} is not healthy`);
          }
          NODE

  verify-migration-ledgers:
    name: Verify staging and production migration ledgers
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Verify Commercial Staging migration ledger
        run: bash scripts/verify-remote-migration-ledger.sh "Commercial Staging" "$COMMERCIAL_STAGING_DATABASE_URL"
        env:
          COMMERCIAL_STAGING_DATABASE_URL: ${{ secrets.COMMERCIAL_STAGING_DATABASE_URL }}
      - name: Verify Commercial Production migration ledger
        run: bash scripts/verify-remote-migration-ledger.sh "Commercial Production" "$COMMERCIAL_PRODUCTION_DATABASE_URL"
        env:
          COMMERCIAL_PRODUCTION_DATABASE_URL: ${{ secrets.COMMERCIAL_PRODUCTION_DATABASE_URL }}

  deploy-production:
    name: Deploy verified SHA to Commercial Production
    needs: [verify-candidate, verify-staging-sha, verify-migration-ledgers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: commercial-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Enforce commercial-only credential guard
        shell: bash
        run: |
          test "${{ secrets.COMMERCIAL_RELEASE_GUARD }}" = "commercial-only"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
      - name: Install dependencies and pinned Vercel CLI
        run: |
          npm ci
          npm install --global vercel@58.5.1
      - name: Deploy exact candidate
        shell: bash
        run: |
          set -o pipefail
          vercel deploy --yes --prod \
            --build-env "DEPLOYMENT_SHA=${{ inputs.expected_sha }}" \
            --env "DEPLOYMENT_SHA=${{ inputs.expected_sha }}" \
            --meta "githubCommitSha=${{ inputs.expected_sha }}" \
            --token="${{ secrets.COMMERCIAL_PRODUCTION_VERCEL_TOKEN }}" 2>&1 | tee deployment.log
          grep -Eo 'https://[^[:space:]]+\.vercel\.app' deployment.log | tail -1 > production-url.txt
          test -s production-url.txt
        env:
          VERCEL_ORG_ID: ${{ secrets.COMMERCIAL_PRODUCTION_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.COMMERCIAL_PRODUCTION_VERCEL_PROJECT_ID }}
      - name: Verify production liveness and exact SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          production_url="$(cat production-url.txt)"
          vercel curl "$production_url/api/health/live" --silent --token="${{ secrets.COMMERCIAL_PRODUCTION_VERCEL_TOKEN }}" > production-live.json
          node - <<'NODE'
          const result = require('./production-live.json');
          if (result.environment !== 'production') throw new Error('Deployment is not Commercial Production');
          if (result.deploymentSha !== process.env.EXPECTED_SHA) throw new Error('Production SHA mismatch');
          if (result.ok !== true) throw new Error('Production liveness failed');
          NODE
          echo "Deployed $EXPECTED_SHA to $production_url" >> "$GITHUB_STEP_SUMMARY"
