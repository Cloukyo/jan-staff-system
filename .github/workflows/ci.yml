name: Commercial CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: commercial-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build commercial preview configuration
        run: npm run build
        env:
          APP_ENV: preview
          APP_MODE: production
          NEXT_PUBLIC_SITE_URL: https://ci-preview.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://ci-preview.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_PROJECT_REF: ci-preview
          PRODUCTION_SUPABASE_PROJECT_REF: ci-production
          PRODUCTION_SITE_HOST: commercial.example.invalid
          DEPLOYMENT_SHA: ${{ github.sha }}

  migrations:
    name: Apply and test every migration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0
          github-token: ${{ github.token }}
      - name: Start clean local database and apply migrations
        run: supabase db start
      - name: Verify local migration history
        run: supabase migration list --local
      - name: Run database tests
        run: supabase test db supabase/tests --local
      - name: Lint database schema
        run: supabase db lint --local --level warning --fail-on error
      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
